name: Issue 523 replay verification
on:
  push:
    branches: [validation/523-conflicts-20261127]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /tmp/prism-523-target
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: issue-523-verification
          cache-on-failure: true
      - name: Create isolated source harnesses
        run: |
          python3 .github/issue-523-harness.py --repo "$GITHUB_WORKSPACE" --notes /tmp/prism-523 --base-sha 68c0c78e54e50a87c05134e0d0466d85f8ef6b10
          ! grep -E 'baseline-(app|inspector)' /tmp/prism-523/harness/lib.rs
      - name: Prove regressions fail before fixes
        run: |
          set +e
          CARGO_TARGET_DIR=/tmp/prism-523-baseline-target cargo test --manifest-path /tmp/prism-523/baseline-harness/Cargo.toml > /tmp/prism-523/baseline-tui.log 2>&1
          result=$?
          set -e
          echo "$result" > /tmp/prism-523/baseline-exit.txt
          test "$result" -ne 0
          grep -F 'test result: FAILED' /tmp/prism-523/baseline-tui.log
          cp /tmp/prism-523/baseline-harness/Cargo.lock /tmp/prism-523/harness/Cargo.lock
      - name: Run current TUI source tests
        run: cargo test --locked --manifest-path /tmp/prism-523/harness/Cargo.toml -- --nocapture 2>&1 | tee /tmp/prism-523/tui.log
      - name: Check touched Rust formatting
        run: rustfmt --edition 2021 --check crates/cli/src/tui/app.rs crates/cli/src/tui/widgets/inspector.rs
      - name: Check isolated TUI Clippy
        run: cargo clippy --locked --manifest-path /tmp/prism-523/harness/Cargo.toml --all-targets -- -D warnings 2>&1 | tee /tmp/prism-523/clippy.log
      - name: Build source-backed replay fixture executable
        run: cargo build --locked --manifest-path /tmp/prism-523/harness/Cargo.toml --bin replay-validation
      - name: Exercise real pseudo-terminal lifecycle
        run: python3 .github/issue-523-pty.py /tmp/prism-523-target/debug/replay-validation /tmp/prism-523/pty-results.json 2>&1 | tee /tmp/prism-523/pty.log
      - name: Check full CLI integration
        continue-on-error: true
        run: |
          set +e
          cargo test -p grat --bin grat tui:: > /tmp/prism-523/full-cli.log 2>&1
          result=$?
          echo "$result" > /tmp/prism-523/full-cli-exit.txt
          tail -n 100 /tmp/prism-523/full-cli.log
          exit "$result"
      - name: Compare unchanged upstream full CLI compilation
        continue-on-error: true
        run: |
          git worktree add --detach /tmp/prism-523-upstream 68c0c78e54e50a87c05134e0d0466d85f8ef6b10
          cp Cargo.lock /tmp/prism-523-upstream/Cargo.lock
          set +e
          cargo test --locked --manifest-path /tmp/prism-523-upstream/Cargo.toml -p grat --bin grat tui:: > /tmp/prism-523/upstream-cli.log 2>&1
          result=$?
          echo "$result" > /tmp/prism-523/upstream-cli-exit.txt
          tail -n 100 /tmp/prism-523/upstream-cli.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-523-results
          path: |
            /tmp/prism-523/*.log
            /tmp/prism-523/*.json
            /tmp/prism-523/*exit.txt
