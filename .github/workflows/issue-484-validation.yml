name: Issue 484 isolated validation
on:
  push:
    branches: [validation/484-controls]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format contribution files
        run: |
          mkdir -p /tmp/issue-484-results/formatted
          rustfmt --edition 2021 crates/cli/src/tui/app.rs crates/cli/src/tui/state.rs crates/cli/src/tui/widgets/controls.rs
          cp crates/cli/src/tui/app.rs crates/cli/src/tui/state.rs crates/cli/src/tui/widgets/controls.rs /tmp/issue-484-results/formatted/
      - name: Confirm baseline compilation blocker
        run: |
          git fetch origin 4d7390ebe6721023ecf3b55da08382101c55361b
          git worktree add /tmp/issue-484-baseline 4d7390ebe6721023ecf3b55da08382101c55361b
          cargo generate-lockfile
          cp Cargo.lock /tmp/issue-484-baseline/Cargo.lock
          set +e
          (cd /tmp/issue-484-baseline && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo check -p grat-core) > /tmp/issue-484-results/baseline.log 2>&1
          result=$?
          set -e
          echo "Baseline exit: $result"
          test "$result" -ne 0
          grep 'could not compile' /tmp/issue-484-results/baseline.log
      - name: Isolated actual TUI tests and terminal preview
        run: |
          python3 .github/issue-484-harness.py
          cargo test --manifest-path /tmp/issue-484-harness/Cargo.toml -- --nocapture 2>&1 | tee /tmp/issue-484-results/tui.log
      - name: Isolated TUI Clippy
        if: success() || failure()
        run: cargo clippy --manifest-path /tmp/issue-484-harness/Cargo.toml --all-targets -- -D warnings 2>&1 | tee /tmp/issue-484-results/clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-484-results
          path: /tmp/issue-484-results
